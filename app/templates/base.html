<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fontzy{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/assets/icon.ico">
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --surface-hover: #181818;
      --surface-active: #222222;
      --border: #2a2a2a;
      --border-hover: #3a3a3a;
      --text: #eeeeee;
      --text-muted: #888888;
      --text-dim: #555555;
      --accent: #657153;
      --accent-hover: #849672;
      --accent-dim: rgba(101, 113, 83, 0.15);
      --danger: #cc4444;
      --danger-hover: #e06666;
      --danger-dim: rgba(204, 68, 68, 0.12);
      --success: #849672;
      --success-dim: rgba(132, 150, 114, 0.15);
      --warning: #a3b08f;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.7);
      --transition: all 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Layout ===== */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* ===== Header ===== */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .brand-tagline {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.2;
    }

    /* ===== Main ===== */
    .main {
      flex: 1;
      padding: 32px 0 64px;
    }

    /* ===== Footer ===== */
    .footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 24px 0;
      color: var(--text-dim);
      font-size: 13px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ===== Typography ===== */
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .text-muted { color: var(--text-muted); }
    .text-dim { color: var(--text-dim); }
    .text-accent { color: var(--accent); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      transition: var(--transition);
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-danger {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    /* ===== Upload Zone ===== */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .upload-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: scale(1.01);
    }

    .upload-zone-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--accent-dim);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .upload-zone-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-zone-hint {
      color: var(--text-muted);
      font-size: 14px;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* ===== Stats Bar ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .stat-icon.blue { background: rgba(255, 255, 255, 0.06); }
    .stat-icon.green { background: rgba(255, 255, 255, 0.06); }
    .stat-icon.orange { background: rgba(255, 255, 255, 0.06); }
    .stat-icon.purple { background: rgba(255, 255, 255, 0.06); }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ===== Family Grid ===== */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .family-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: var(--transition);
      position: relative;
    }

    .family-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .family-card-preview {
      padding: 32px 24px;
      background: linear-gradient(180deg, var(--surface-active) 0%, var(--surface) 100%);
      border-bottom: 1px solid var(--border);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .family-card-preview-text {
      font-size: 32px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .family-card-preview-abc {
      font-size: 13px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.7;
    }

    .family-card-body {
      padding: 20px;
    }

    .family-card-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .family-card-name a {
      color: var(--text);
      text-decoration: none;
    }
    .family-card-name a:hover {
      color: var(--accent);
    }

    .family-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--surface-active);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .tag.accent {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .family-card-actions {
      display: flex;
      gap: 8px;
    }

    .family-card-actions .btn {
      flex: 1;
      justify-content: center;
    }

    .family-card-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      transition: var(--transition);
    }

    .family-card:hover .family-card-delete {
      opacity: 1;
    }

    .family-card-delete:hover {
      background: var(--danger-dim);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* ===== Code Block ===== */
    .code-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      position: relative;
      overflow: hidden;
    }

    .code-block pre {
      margin: 0;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .code-block .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 10px;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: var(--transition);
    }

    .code-block:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .copy-btn.copied {
      background: var(--success-dim);
      color: var(--success);
      border-color: var(--success);
      opacity: 1;
    }

    /* ===== Preview Section ===== */
    .preview-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 32px;
      margin-bottom: 24px;
    }

    .preview-editor {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 40px;
      color: var(--text);
      resize: vertical;
      line-height: 1.3;
    }

    .preview-editor::placeholder {
      color: var(--text-dim);
    }

    .preview-weights {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .weight-pill {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface-active);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .weight-pill:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .weight-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ===== Table ===== */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .data-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }

    .data-table tr:hover td {
      background: var(--surface-hover);
      color: var(--text);
    }

    .data-table td:first-child {
      font-weight: 500;
      color: var(--text);
    }

    /* ===== Toast ===== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.3s ease;
      font-size: 14px;
      font-weight: 500;
    }

    .toast.success {
      border-color: var(--success);
      color: var(--success);
    }

    .toast.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes toastOut {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(20px); opacity: 0; }
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--surface-active);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .empty-state h2 {
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .family-grid {
        grid-template-columns: 1fr;
      }
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      h1 { font-size: 24px; }
      .preview-editor { font-size: 28px; }
      .header-inner {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .stats-bar {
        grid-template-columns: 1fr;
      }
    }

    /* ===== Animations ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeIn 0.4s ease;
    }

    /* ===== Section header ===== */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-header h2 {
      margin-bottom: 0;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="container header-inner">
        <a href="/" class="brand">
          <div class="brand-icon"><img src="/assets/icon.png" alt="Fontzy"></div>
          <div class="brand-text">
            <span class="brand-name">Fontzy</span>
            <span class="brand-tagline">Self-hosted font serving</span>
          </div>
        </a>
        <div style="display: flex; gap: 8px;">
          <a href="/" class="btn btn-ghost btn-sm">Dashboard</a>
          <a href="https://github.com" target="_blank" class="btn btn-ghost btn-sm" style="font-size: 18px;">&#9432;</a>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>Fontzy &mdash; your fonts, your server</span>
        <span class="text-dim">Built with FastAPI + fonttools</span>
      </div>
    </footer>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // ===== Toast Notifications =====
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = type === 'success' ? '&#10003; ' + message : '&#10007; ' + message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ===== Copy to Clipboard =====
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btn.textContent = 'Copied!';
        showToast('Copied to clipboard');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = 'Copy';
        }, 2000);
      }).catch(() => {
        showToast('Failed to copy', 'error');
      });
    }

    // ===== Delete Font =====
    async function deleteFont(family, btn) {
      if (!confirm(`Delete font family "${family}"? This cannot be undone.`)) return;
      try {
        const resp = await fetch(`/api/font/${family}`, { method: 'DELETE' });
        if (resp.ok) {
          showToast(`"${family}" deleted`);
          const card = btn.closest('.family-card');
          card.style.transition = 'all 0.3s ease';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.95)';
          setTimeout(() => card.remove(), 300);
        } else {
          showToast('Failed to delete', 'error');
        }
      } catch (e) {
        showToast('Failed to delete', 'error');
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
