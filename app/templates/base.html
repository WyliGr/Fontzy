<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fontzy{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafafa;
      line-height: 1.6;
    }
    h1 { font-weight: 700; margin-bottom: 8px; }
    h2 { font-weight: 600; margin-top: 32px; margin-bottom: 12px; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      background: #111;
      color: #fff;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #333; }
    input[type="file"] { margin-bottom: 10px; }
    code, pre {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    pre { padding: 12px; overflow-x: auto; }
    .muted { color: #6b7280; font-size: 14px; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f3f4f6;
      font-size: 12px;
      margin-right: 6px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <h1><a href="/">Fontzy</a></h1>
  <p class="muted">Self-hosted font serving. Your fonts, your server.</p>
  {% block content %}{% endblock %}
</body>
</html>
