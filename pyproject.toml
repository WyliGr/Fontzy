[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fontzy"
version = "0.1.0"
description = "Self-hosted font serving system that mimics Google Fonts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fonttools>=4.55.0",
    "brotli>=1.1.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
